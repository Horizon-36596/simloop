# The public leak gate and a secret scan, on every pull request and every push to main.
#
# Both jobs only read the repository. `pull_request` (never `pull_request_target`) runs a fork's pull
# request with a read-only token and no secrets, so nothing in a pull request can use this repository's
# permissions.
#
# The job names are what branch protection requires (see docs/MAINTAINERS.md); renaming a job means
# updating the required checks too.
name: Leak gate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Season-agnostic and nobody's machine: no :TeamCode dependency, no FTC game names in the library, no
  # home directories, CAD, robot logs, keys or files over 1 MB. Rules: tools/leak-gate/patterns.txt.
  leak-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Run the leak gate
      run: bash tools/leak-gate/leak-gate.sh

  # gitleaks over the whole history, so a secret added in one commit and deleted in the next is still
  # caught. The binary is a pinned release checked against its published SHA-256, not gitleaks-action,
  # which needs a paid licence for an organisation. To upgrade, change both values below, taking the
  # checksum from the release's gitleaks_<version>_checksums.txt.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install gitleaks
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        ./gitleaks version

    - name: Scan the history for secrets
      run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
