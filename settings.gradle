// SimLoop is the only module in this repository that is published, and that is load-bearing. JitPack
// names the artifact after the REPOSITORY while a build publishes exactly one module
// (`com.github.Horizon-36596:simloop`), and switches to naming it after the module the moment a build
// publishes two. So adding a second published module here would silently rename this one out from under
// everyone depending on it. Add modules freely; just do not publish them.
//
// Keeping SimLoop a subproject rather than the root project is a separate matter, and the reason is
// only that the Android Gradle Plugin's library plugin then applies to the shape it expects - the shape
// every FTC project already has. It does not affect the coordinate.
rootProject.name = 'SimLoop'

include ':SimLoop'

// SimLoop's desktop half: the window that turns held-down keys into a gamepad for a live-drive session. A
// plain Java library, because SimLoop is an Android module and compiles against android.jar, which has no
// AWT. Not published as a module of its own (see the note at the top of this file): its jar rides in
// :SimLoop's publication with the classifier `desktop`.
include ':SimLoop:desktop'

// The example robot, in `simloop-starter/`. It is a folder teams copy into their own project, and this
// module is what compiles it and runs its tests so it cannot rot - see examples/build.gradle. It is
// never published: jitpack.yml installs `:SimLoop:publishToMavenLocal` and nothing else.
include ':examples'
